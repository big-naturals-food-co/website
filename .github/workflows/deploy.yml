name: Site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Serialize the complete build/deploy sequence. Never cancel a live publication.
concurrency:
  group: big-naturals-site-${{ github.ref }}
  cancel-in-progress: false

env:
  NUXT_TELEMETRY_DISABLED: '1'
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '066540957026'

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            cloud/aws/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix cloud/aws
      - name: Validate infrastructure and publication
        working-directory: cloud/aws
        run: |
          npm run typecheck
          npm test
          npm run synth
          npm run synth:access
      - name: Generate static site
        working-directory: web
        run: |
          npm run typecheck
          npm run generate
      - name: Validate publication files without AWS access
        working-directory: cloud/aws
        run: npm run publish:site -- --dry-run
      - name: Save the generated site for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-site-${{ github.sha }}
          path: web/.output/public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse deployment from an outdated main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo 'This run is no longer the main tip. Deploy the latest main run instead.' >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cloud/aws/package-lock.json
      - name: Prepare infrastructure before obtaining credentials
        working-directory: cloud/aws
        run: |
          npm ci
          npm run synth
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-site-${{ github.sha }}
          path: web/.output/public/
      - name: Authenticate to AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::066540957026:role/big-naturals-food-co-github-deploy
          role-session-name: big-naturals-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          unset-current-credentials: true
      - name: Deploy the site infrastructure
        working-directory: cloud/aws
        run: >-
          npm run cdk -- --app cdk.out deploy BigNaturalsFoodCoSite
          --method change-set --require-approval never
          --outputs-file cdk.out/deploy-outputs.json
      - name: Publish files and refresh CloudFront
        working-directory: cloud/aws
        run: npm run publish:site -- --outputs cdk.out/deploy-outputs.json
      - name: Verify public HTTPS and redirects
        working-directory: cloud/aws
        run: npm run verify:site
